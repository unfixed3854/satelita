name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Install dependencies
        run: deno ci

      - name: Audit dependencies
        run: deno audit --level=moderate

      - name: Run tests
        run: deno task test

      - name: Build and type-check
        run: deno task build
